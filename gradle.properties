# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

kotlin.code.style=official

# Eleven modules, most of which do not depend on each other, so they can configure and build at
# the same time instead of one after another.
org.gradle.parallel=true

# Reuses task outputs across builds and across branches. Safe - a task whose inputs changed is
# still rerun; this only skips the ones whose inputs did not.
org.gradle.caching=true

# When enabled, the Configuration Cache allows Gradle to skip the configuration phase entirely if
# nothing that affects the build configuration (such as build scripts) has changed.
org.gradle.configuration-cache=true

# 2048m is not enough headroom for R8 and for Kotlin compilation of eleven modules at once, which
# shows up as a daemon that restarts mid-build.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Only configure the modules the requested task actually needs.
org.gradle.configureondemand=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
