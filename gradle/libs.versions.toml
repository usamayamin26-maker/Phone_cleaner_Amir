[versions]
agp = "9.4.1"
# Kotlin Gradle plugin. AGP 9 compiles Kotlin itself (built-in Kotlin); the serialization plugin
# below puts this KGP version on the build classpath, which is the version AGP then compiles with.
kotlin = "2.4.20"
# KSP2 (Kotlin Symbol Processing) is versioned on its own since 2.3.0 - no "-<kotlin>" suffix.
ksp = "2.3.9"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
lifecycle = "2.11.0"
fragment = "1.9.1"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
splashscreen = "1.2.0"
exifinterface = "1.4.2"
coroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
koinBom = "4.2.2"
room = "2.8.5"
sdp = "1.1.1"
ssp = "1.1.1"
lottie = "6.7.1"

# firebase - same versions as UniversalRemoteControl
firebaseBom = "34.19.0"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"
# AdMob and its mediation - same versions as UniversalRemoteControl. Each adapter's version is
# <partner SDK version>.<adapter revision> and pulls its partner SDK transitively, except Unity,
# whose SDK Google stopped bundling: it stays on the version its adapter was built against. The
# whole set is built for play-services-ads 25.4.0/25.5.0, so a GMA bump means bumping these too.
playServicesAds = "25.5.0"
userMessagingPlatform = "4.0.0"
shimmer = "0.5.0"
appUpdate = "2.1.0"
unityAds = "4.21.0"
mediationUnity = "4.21.0.0"
mediationMintegral = "17.1.81.1"
mediationPangle = "8.3.0.4.0"
mediationFacebook = "6.22.0.1"
mediationApplovin = "13.6.4.2"
mediationYandex = "8.6.0.0"
# Coil 3 - thumbnails of photos, video frames and app icons.
coil = "3.6.3"
# LiteRT is the renamed TensorFlow Lite runtime (org.tensorflow:tensorflow-lite moved here).
litert = "2.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koinBom" }
koin-android = { group = "io.insert-koin", name = "koin-android" }

# Room - the app's local cache (data/local). Only :app uses it.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

intuit-sdp = { group = "com.intuit.sdp", name = "sdp-android", version.ref = "sdp" }
intuit-ssp = { group = "com.intuit.ssp", name = "ssp-android", version.ref = "ssp" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }

# firebase - versions come from the BoM
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }

# admob - the ads/ package. Remote Config above drives every placement; UMP (User Messaging
# Platform) runs the consent form; shimmer draws the loading placeholder in an ad slot.
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
user-messaging-platform = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "userMessagingPlatform" }
shimmer = { group = "com.facebook.shimmer", name = "shimmer", version.ref = "shimmer" }

# Google Play in-app updates, driven by in_app_update_type in the ads JSON.
play-app-update = { group = "com.google.android.play", name = "app-update", version.ref = "appUpdate" }

# AdMob mediation. No code: the Mobile Ads SDK discovers the adapters at initialize(). Mintegral
# and Pangle resolve only through the two repositories in settings.gradle.kts.
unity-ads = { group = "com.unity3d.ads", name = "unity-ads", version.ref = "unityAds" }
mediation-unity = { group = "com.google.ads.mediation", name = "unity", version.ref = "mediationUnity" }
mediation-mintegral = { group = "com.google.ads.mediation", name = "mintegral", version.ref = "mediationMintegral" }
mediation-pangle = { group = "com.google.ads.mediation", name = "pangle", version.ref = "mediationPangle" }
mediation-facebook = { group = "com.google.ads.mediation", name = "facebook", version.ref = "mediationFacebook" }
mediation-applovin = { group = "com.google.ads.mediation", name = "applovin", version.ref = "mediationApplovin" }
mediation-yandex = { group = "com.yandex.ads.adapter", name = "admob-mobileads", version.ref = "mediationYandex" }
coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }

litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
